image:
  registry: ghcr.io
  repository: middleware-labs/ruby-app
  # must be a build that includes network.capture.features (flow_packets)
  tag: ntest2
  pullPolicy: Always

preset: network

config:
  data:
    extensions:
      obi:
        version: "2.0"
        capture:
          network:
            capture:
              enabled: true
              features:
                - flow_packets
              enrichment:
                reverse_dns:
                  mode: ebpf
                  cache:
                    size: 256
                    ttl: 1h
            stats:
              enabled: true
              features:
                - tcp_rtt
                - tcp_failed_connections
                - tcp_successful_connections
                - tcp_retransmits
                - tcp_io
                - tcp_flow_control
                - tcp_congestion
                - tcp_closed_connections
                - dns_lookups
        enrich:
          attributes:
            select:
              obi.network.flow.bytes:
                include: [host.id, direction, transport, src.address, dst.address,
                          src.name, dst.name, src.cidr, dst.cidr, obi.ip,
                          k8s.cluster.name, k8s.src.namespace, k8s.src.owner.name, k8s.src.owner.type,
                          k8s.dst.namespace, k8s.dst.owner.name, k8s.dst.owner.type]
              obi.network.flow.packets:
                include: [host.id, direction, transport, src.address, dst.address,
                          src.name, dst.name, src.cidr, dst.cidr, obi.ip,
                          k8s.src.owner.name, k8s.dst.owner.name]
              obi.network.inter.zone.bytes:
                include: [host.id, k8s.cluster.name, src.zone, dst.zone]
              obi.stat.tcp.rtt:
                include: ["*"]
                exclude: [src.port, dst.port]
              obi.stat.tcp.retransmits:
                include: ["*"]
                exclude: [src.port, dst.port]
              obi.stat.tcp.failed.connections:
                include: ["*"]
                exclude: [src.port, dst.port]
              obi.stat.tcp.successful.connections:
                include: ["*"]
                exclude: [src.port, dst.port]
              obi.stat.tcp.closed.connections:
                include: ["*"]
                exclude: [src.port, dst.port]
              obi.stat.tcp.io:
                include: ["*"]
                exclude: [src.port, dst.port]
              obi.stat.tcp.flow_control.events:
                include: ["*"]
                exclude: [src.port, dst.port]
              obi.stat.tcp.ecn.ce.packets:
                include: ["*"]
                exclude: [src.port, dst.port]
              obi.stat.tcp.reordering.events:
                include: ["*"]
                exclude: [src.port, dst.port]
              obi.stat.tcp.out_of_order.packets:
                include: ["*"]
                exclude: [src.port, dst.port]
              obi.stat.dns.lookup.duration:
                include: ["*"]
                exclude: [src.port, dst.port]
          enrichers:
            kubernetes:
              mode: enabled
              cluster_name: npm-cluster
    meter_provider:
      readers:
        - periodic:
            interval: 30000
            exporter:
              otlp_grpc:
                endpoint: http://mw-service.mw-agent-ns.svc.cluster.local:9319
                tls:
                  insecure: true
    tracer_provider: null

k8sCache:
  replicas: 1
