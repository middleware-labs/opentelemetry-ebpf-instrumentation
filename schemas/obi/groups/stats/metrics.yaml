  - name: obi.stat.tcp.ecn.ce.packets
    instrument: counter
    unit: "{packet}"
    stability: development
    requirement_level: recommended
    brief: >
      Count of sent TCP packets that a router on the path marked as ECN
      congestion experienced (CE) and the receiver echoed back. Read from the
      kernel's per-socket `delivered_ce` counter at send, receive and close,
      so it is non-zero only on connections that negotiated ECN. `src` is the
      sender of the marked packets.
    attributes:
      - ref: obi.ip
        requirement_level: opt_in
      - ref: src.address
        requirement_level: recommended
      - ref: dst.address
        requirement_level: recommended
      - ref: src.port
        requirement_level: opt_in
      - ref: dst.port
        requirement_level: opt_in
      - ref: server.port
