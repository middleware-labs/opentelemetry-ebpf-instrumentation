  - name: obi.stat.tcp.flow_control.events
    instrument: counter
    unit: "{event}"
    stability: development
    requirement_level: recommended
    brief: >
      Count of TCP flow-control events. For `zero_window`, one event is one
      zero-window probe sent because the peer advertised a zero receive
      window, so a longer stall produces more events. `src` is the blocked
      sender, `dst` is the receiver that is not reading.
